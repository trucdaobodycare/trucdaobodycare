<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Trúc Đào Cosmetics - Demo</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin:0; padding:0; background:#f7f7f7; }
    header { background:#222; color:white; padding:12px 20px; display:flex; align-items:center; justify-content:space-between; }
    header h1 { margin:0; font-size:18px; color:#ff6ea6; }
    main { padding:20px; max-width:1000px; margin:0 auto; }
    .products { display:flex; gap:12px; flex-wrap:wrap; }
    .card { background:white; padding:12px; border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,0.08); width:220px; }
    .card img { width:100%; height:140px; object-fit:cover; border-radius:6px; }
    .login { background:white; padding:12px; border-radius:8px; width:300px; box-shadow:0 1px 6px rgba(0,0,0,0.06); }
    .flex { display:flex; gap:12px; }
    .muted { color:#666; font-size:14px; }
    #mock-ind { position:fixed; right:12px; bottom:12px; padding:6px 8px; background:#111; color:white; border-radius:6px; font-size:12px; display:none; z-index:9999; }
  </style>
</head>
<body>
  <header>
    <h1>Trúc Đào Cosmetics</h1>
    <div>
      <button id="btnRefresh">Làm mới sản phẩm</button>
      <button id="btnShowLogin">Đăng nhập Admin</button>
    </div>
  </header>

  <main>
    <section>
      <h2>Sản phẩm</h2>
      <div id="products" class="products">
        <!-- products injected here -->
      </div>
      <p id="products-msg" class="muted"></p>
    </section>

    <hr style="margin:20px 0" />

    <section>
      <h2>Admin Area (demo)</h2>
      <div id="adminArea">
        <p class="muted">Chưa đăng nhập</p>
      </div>
    </section>
  </main>

  <!-- Login modal -->
  <div id="loginModal" style="display:none; position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);">
    <div class="login">
      <h3>Đăng nhập Admin</h3>
      <form id="loginForm">
        <div>
          <label>Tên đăng nhập</label><br/>
          <input name="username" required style="width:100%; padding:8px; margin:6px 0" />
        </div>
        <div>
          <label>Mật khẩu</label><br/>
          <input type="password" name="password" required style="width:100%; padding:8px; margin:6px 0" />
        </div>
        <div class="flex" style="justify-content:flex-end;">
          <button type="button" id="btnCloseLogin">Hủy</button>
          <button type="submit">Đăng nhập</button>
        </div>
        <p id="loginError" class="muted" style="color:red"></p>
      </form>
    </div>
  </div>

  <div id="mock-ind">Server: not connected</div>

<script>
async function fetchProducts() {
  const msg = document.getElementById('products-msg');
  const container = document.getElementById('products');
  container.innerHTML = '';
  msg.textContent = 'Đang tải...';
  try {
    const res = await fetch('/api/products');
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if(!Array.isArray(data)) {
      msg.textContent = 'Dữ liệu sản phẩm không đúng định dạng';
      return;
    }
    msg.textContent = '';
    if(data.length === 0) {
      msg.textContent = 'Chưa có sản phẩm.';
    }
    data.forEach(p => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img src="${p.image || 'data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=400 height=300><rect width=100% height=100% fill=%23eee/></svg>'}" alt="${p.name}" />
        <h4>${p.name}</h4>
        <p class="muted">${p.price ? (p.price.toLocaleString() + ' ₫') : ''}</p>
      `;
      container.appendChild(card);
    });
  } catch(err) {
    msg.textContent = 'Lỗi tải sản phẩm: ' + err.message;
    console.error(err);
  }
}

document.getElementById('btnRefresh').addEventListener('click', fetchProducts);
document.getElementById('btnShowLogin').addEventListener('click', ()=> {
  document.getElementById('loginModal').style.display = 'block';
});

document.getElementById('btnCloseLogin').addEventListener('click', ()=> {
  document.getElementById('loginModal').style.display = 'none';
});

document.getElementById('loginForm').addEventListener('submit', async (e)=> {
  e.preventDefault();
  const form = e.target;
  const fd = new FormData(form);
  const body = { username: fd.get('username'), password: fd.get('password') };
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if(res.status === 401) {
      errEl.textContent = 'Sai tài khoản hoặc mật khẩu';
      return;
    }
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    // store token in sessionStorage
    sessionStorage.setItem('token', data.token);
    document.getElementById('loginModal').style.display = 'none';
    document.getElementById('adminArea').innerHTML = '<p>Đã đăng nhập với role: ' + (data.role || 'user') + '</p>';
    document.getElementById('mock-ind').textContent = 'Server: connected';
    document.getElementById('mock-ind').style.display = 'block';
  } catch(err) {
    errEl.textContent = 'Lỗi đăng nhập: ' + err.message;
    console.error(err);
  }
});

// initial load
fetchProducts();
</script>
</body>
</html>

<script>
    // Admin credentials
    const ADMIN_USERNAME = "Trucdaoadminlogin";
    const ADMIN_PASSWORD = "Thanhduy@060596";
    
    // API Base URL
    const API_BASE = '/api';

    // Data storage
    let products = [];
    let messages = [];
    let visitors = { total: 0, today: 0, date: new Date().toDateString() };
    let productViews = {};
    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    // ==================== API FUNCTIONS ====================

    // Hàm gọi API để lấy sản phẩm
    async function loadProductsFromAPI() {
        try {
            console.log('🔄 Đang tải sản phẩm từ API...');
            const response = await fetch(`${API_BASE}/products`);
            if (response.ok) {
                const apiProducts = await response.json();
                console.log(`✅ Đã tải ${apiProducts.length} sản phẩm từ database`);
                
                // Cập nhật danh sách sản phẩm từ API
                if (apiProducts && apiProducts.length > 0) {
                    products = apiProducts;
                    renderProductsInAdmin();
                    updateProductDisplay();
                }
            } else {
                console.warn('⚠️ Không thể tải sản phẩm từ API');
            }
        } catch (error) {
            console.error('❌ Lỗi khi tải sản phẩm từ API:', error);
        }
    }

    // Hàm lưu sản phẩm lên API
    async function saveProductToAPI(product) {
        try {
            const productData = {
                name: product.name,
                category: product.category,
                originalPrice: product.originalPrice,
                salePrice: product.salePrice,
                image: product.image,
                description: product.description
            };

            let response;
            if (product.id) {
                // Update existing product
                response = await fetch(`${API_BASE}/products/${product.id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(productData)
                });
            } else {
                // Add new product
                response = await fetch(`${API_BASE}/products`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(productData)
                });
            }
            
            if (response.ok) {
                const result = await response.json();
                console.log('✅ Sản phẩm đã được lưu vào database');
                return result;
            }
        } catch (error) {
            console.error('❌ Lỗi khi lưu sản phẩm:', error);
        }
        return null;
    }

    // Hàm xóa sản phẩm từ API
    async function deleteProductFromAPI(productId) {
        try {
            const response = await fetch(`${API_BASE}/products/${productId}`, {
                method: 'DELETE'
            });
            
            if (response.ok) {
                console.log('✅ Sản phẩm đã được xóa khỏi database');
                return true;
            }
        } catch (error) {
            console.error('❌ Lỗi khi xóa sản phẩm:', error);
        }
        return false;
    }

    // Hàm lấy tin nhắn từ API
    async function loadMessagesFromAPI() {
        try {
            const response = await fetch(`${API_BASE}/messages`);
            if (response.ok) {
                const apiMessages = await response.json();
                messages = apiMessages;
                updateMessagesInAdmin();
                return apiMessages;
            }
        } catch (error) {
            console.error('Lỗi khi tải tin nhắn:', error);
        }
        return [];
    }

    // Hàm lưu tin nhắn lên API
    async function saveMessageToAPI(message) {
        try {
            const response = await fetch(`${API_BASE}/messages`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(message)
            });
            
            return response.ok;
        } catch (error) {
            console.error('Lỗi khi lưu tin nhắn:', error);
            return false;
        }
    }

    // Hàm đánh dấu tin nhắn đã đọc
    async function markMessageAsRead(messageId) {
        try {
            const response = await fetch(`${API_BASE}/messages/${messageId}/read`, {
                method: 'PUT'
            });
            return response.ok;
        } catch (error) {
            console.error('Lỗi khi đánh dấu tin nhắn:', error);
            return false;
        }
    }

    // Hàm trả lời tin nhắn
    async function replyToMessage(messageId, replyText) {
        try {
            const response = await fetch(`${API_BASE}/messages/${messageId}/reply`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    text: replyText,
                    adminName: 'Admin'
                })
            });
            
            if (response.ok) {
                await loadMessagesFromAPI();
                return true;
            }
        } catch (error) {
            console.error('Lỗi khi gửi phản hồi:', error);
        }
        return false;
    }

    // Hàm cập nhật lượt truy cập
    async function updateVisitorCountAPI() {
        try {
            const response = await fetch(`${API_BASE}/visitors`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                }
            });
            
            if (response.ok) {
                const visitorData = await response.json();
                visitors = visitorData;
                updateAnalytics();
            }
        } catch (error) {
            console.error('Lỗi khi cập nhật lượt truy cập:', error);
        }
    }

    // ==================== TÍNH NĂNG TRẢ LỜI TIN NHẮN ====================

    // Hàm hiển thị form trả lời
    function showReplyForm(messageId) {
        // Ẩn tất cả form trả lời khác
        document.querySelectorAll('.reply-section').forEach(form => {
            form.style.display = 'none';
        });
        
        // Hiển thị form trả lời cho tin nhắn này
        const replySection = document.getElementById(`reply-section-${messageId}`);
        if (replySection) {
            replySection.style.display = 'block';
            replySection.querySelector('.reply-input').focus();
        }
    }

    // ==================== KHỞI ĐỘNG ====================

    // Khởi tạo
    document.addEventListener('DOMContentLoaded', function() {
        updateVisitorCountAPI();
        loadProductsFromAPI();
        loadMessagesFromAPI();
        updateAnalytics();
        updateCartCount();
        renderCartItems();
        
        // Mobile navigation
        const mobileMenuToggle = document.getElementById('mobile-menu-toggle');
        const mobileNav = document.getElementById('mobile-nav');
        const closeMobileNav = document.getElementById('close-mobile-nav');
        const mobileNavOverlay = document.getElementById('mobile-nav-overlay');
        
        mobileMenuToggle.addEventListener('click', function() {
            mobileNav.classList.add('active');
            mobileNavOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        });
        
        closeMobileNav.addEventListener('click', function() {
            mobileNav.classList.remove('active');
            mobileNavOverlay.classList.remove('active');
            document.body.style.overflow = '';
        });
        
        mobileNavOverlay.addEventListener('click', function() {
            mobileNav.classList.remove('active');
            mobileNavOverlay.classList.remove('active');
            document.body.style.overflow = '';
        });
        
        // Track product views
        document.querySelectorAll('.product-card').forEach(card => {
            card.addEventListener('click', function() {
                const productId = this.getAttribute('data-id');
                productViews[productId] = (productViews[productId] || 0) + 1;
                localStorage.setItem('productViews', JSON.stringify(productViews));
                updateAnalytics();
            });
        });
        
        // Add to cart functionality
        document.querySelectorAll('.add-to-cart').forEach(button => {
            button.addEventListener('click', function() {
                const productId = this.getAttribute('data-id');
                const productName = this.getAttribute('data-name');
                const productPrice = parseInt(this.getAttribute('data-price'));
                const productImage = this.getAttribute('data-image');
                
                addToCart(productId, productName, productPrice, productImage);
            });
        });
        
        // Login functionality
        const loginBtn = document.getElementById('login-btn');
        const loginModal = document.getElementById('login-modal');
        const closeLogin = document.getElementById('close-login');
        
        loginBtn.addEventListener('click', (e) => {
            e.preventDefault();
            loginModal.style.display = 'flex';
        });
        
        closeLogin.addEventListener('click', () => {
            loginModal.style.display = 'none';
        });
        
        loginModal.addEventListener('click', (e) => {
            if (e.target === loginModal) {
                loginModal.style.display = 'none';
            }
        });
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                loginModal.style.display = 'none';
            }
        });

        // Thêm tính năng "đang phát triển" cho các menu chưa hoàn thiện
        document.querySelectorAll('.nav-links a, .mobile-nav-links a').forEach(link => {
            if (!link.getAttribute('href') || link.getAttribute('href') === '#') {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    alert('Tính năng đang được công ty cập nhật và phát triển');
                });
            }
        });
    });

    // Cart functionality
    function addToCart(id, name, price, image) {
        const existingItem = cart.find(item => item.id === id);
        
        if (existingItem) {
            existingItem.quantity += 1;
        } else {
            cart.push({
                id: id,
                name: name,
                price: price,
                image: image,
                quantity: 1
            });
        }
        
        localStorage.setItem('cart', JSON.stringify(cart));
        updateCartCount();
        renderCartItems();
        
        // Show notification
        alert(`Đã thêm ${name} vào giỏ hàng!`);
    }
    
    function updateCartCount() {
        const cartCount = document.querySelector('.cart-count');
        const totalItems = cart.reduce((total, item) => total + item.quantity, 0);
        cartCount.textContent = totalItems;
    }
    
    function renderCartItems() {
        const cartItems = document.getElementById('cart-items');
        const cartSubtotal = document.getElementById('cart-subtotal');
        const cartTotal = document.getElementById('cart-total');
        
        cartItems.innerHTML = '';
        
        if (cart.length === 0) {
            cartItems.innerHTML = '<p>Giỏ hàng của bạn đang trống</p>';
            cartSubtotal.textContent = '0đ';
            cartTotal.textContent = '0đ';
            return;
        }
        
        let subtotal = 0;
        
        cart.forEach(item => {
            const itemTotal = item.price * item.quantity;
            subtotal += itemTotal;
            
            const cartItem = document.createElement('div');
            cartItem.className = 'cart-item';
            cartItem.innerHTML = `
                <img src="${item.image}" alt="${item.name}" class="cart-item-image">
                <div class="cart-item-info">
                    <div class="cart-item-name">${item.name}</div>
                    <div class="cart-item-price">${formatPrice(item.price)}</div>
                    <div class="cart-item-quantity">
                        <button class="quantity-btn minus" data-id="${item.id}">-</button>
                        <input type="number" class="quantity-input" value="${item.quantity}" min="1" data-id="${item.id}">
                        <button class="quantity-btn plus" data-id="${item.id}">+</button>
                    </div>
                </div>
            `;
            
            cartItems.appendChild(cartItem);
        });
        
        // Add event listeners for quantity buttons
        document.querySelectorAll('.quantity-btn.minus').forEach(btn => {
            btn.addEventListener('click', function() {
                const productId = this.getAttribute('data-id');
                updateQuantity(productId, -1);
            });
        });
        
        document.querySelectorAll('.quantity-btn.plus').forEach(btn => {
            btn.addEventListener('click', function() {
                const productId = this.getAttribute('data-id');
                updateQuantity(productId, 1);
            });
        });
        
        document.querySelectorAll('.quantity-input').forEach(input => {
            input.addEventListener('change', function() {
                const productId = this.getAttribute('data-id');
                const newQuantity = parseInt(this.value);
                if (newQuantity < 1) {
                    this.value = 1;
                    updateQuantity(productId, 0, 1);
                } else {
                    updateQuantity(productId, 0, newQuantity);
                }
            });
        });
        
        const shipping = 30000;
        const total = subtotal + shipping;
        
        cartSubtotal.textContent = formatPrice(subtotal);
        cartTotal.textContent = formatPrice(total);
    }
    
    function updateQuantity(productId, change, setQuantity = null) {
        const item = cart.find(item => item.id === productId);
        if (item) {
            if (setQuantity !== null) {
                item.quantity = setQuantity;
            } else {
                item.quantity += change;
            }
            
            if (item.quantity < 1) {
                cart = cart.filter(item => item.id !== productId);
            }
            
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            renderCartItems();
        }
    }
    
    // Image upload functionality
    document.getElementById('upload-image-btn').addEventListener('click', function() {
        document.getElementById('edit-product-image-upload').click();
    });
    
    document.getElementById('edit-product-image-upload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const preview = document.getElementById('image-preview');
                preview.src = e.target.result;
                preview.style.display = 'block';
                document.getElementById('edit-product-image-url').value = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    });
    
    // Payment screenshot upload
    document.getElementById('upload-payment-btn').addEventListener('click', function() {
        document.getElementById('payment-screenshot').click();
    });
    
    document.getElementById('payment-screenshot').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const preview = document.getElementById('payment-preview');
                preview.src = e.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    });
    
    // Cart modal functionality
    document.getElementById('cart-icon').addEventListener('click', function(e) {
        e.preventDefault();
        document.getElementById('cart-modal').classList.add('active');
    });
    
    document.getElementById('close-cart').addEventListener('click', function() {
        document.getElementById('cart-modal').classList.remove('active');
    });
    
    // Checkout functionality
    document.getElementById('checkout-btn').addEventListener('click', function() {
        if (cart.length === 0) {
            alert('Giỏ hàng của bạn đang trống!');
            return;
        }
        
        document.getElementById('cart-modal').classList.remove('active');
        document.getElementById('payment-modal').style.display = 'flex';
        
        // Update payment information
        const subtotal = cart.reduce((total, item) => total + (item.price * item.quantity), 0);
        const total = subtotal + 30000;
        document.getElementById('payment-amount').textContent = formatPrice(total);
        
        // Generate payment content
        const productNames = cart.map(item => `${item.name}(${item.quantity})`).join('_');
        document.getElementById('payment-content').textContent = `Tên Khách_${productNames}`;
    });
    
    document.getElementById('close-payment').addEventListener('click', function() {
        document.getElementById('payment-modal').style.display = 'none';
    });
    
    // Confirm payment
    document.getElementById('confirm-payment').addEventListener('click', function() {
        const customerName = document.getElementById('customer-name').value;
        const customerPhone = document.getElementById('customer-phone').value;
        const customerAddress = document.getElementById('customer-address').value;
        const paymentScreenshot = document.getElementById('payment-screenshot').files[0];
        
        if (!customerName || !customerPhone || !customerAddress || !paymentScreenshot) {
            alert('Vui lòng điền đầy đủ thông tin và tải lên ảnh chụp màn hình chuyển khoản!');
            return;
        }
        
        // In a real application, you would send this data to a server
        alert('Đơn hàng của bạn đã được xác nhận! Chúng tôi sẽ liên hệ với bạn trong thời gian sớm nhất.');
        
        // Clear cart and close modals
        cart = [];
        localStorage.setItem('cart', JSON.stringify(cart));
        updateCartCount();
        document.getElementById('payment-modal').style.display = 'none';
        document.getElementById('customer-name').value = '';
        document.getElementById('customer-phone').value = '';
        document.getElementById('customer-address').value = '';
        document.getElementById('payment-screenshot').value = '';
        document.getElementById('payment-preview').style.display = 'none';
    });
    
    // Chat functionality với form thông tin khách hàng
    const chatToggle = document.querySelector('.chat-toggle');
    const chatModal = document.querySelector('.chat-modal');
    const closeChat = document.querySelector('.close-chat');
    const sendBtn = document.querySelector('.send-btn');
    const chatInput = document.querySelector('.chat-footer input');
    const chatBody = document.querySelector('.chat-body');
    const chatButtons = document.querySelectorAll('.chat-btn');
    
    // Thêm form thông tin khách hàng vào chat modal
    const chatHeader = document.querySelector('.chat-header');
    const customerInfoForm = `
        <div class="customer-info-form" id="customer-info-form" style="padding: 15px; background: #f8f9fa; border-bottom: 1px solid #eee;">
            <div style="margin-bottom: 10px;">
                <input type="text" id="customer-chat-name" placeholder="Họ và tên" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 8px;">
            </div>
            <div style="margin-bottom: 10px;">
                <input type="tel" id="customer-chat-phone" placeholder="Số điện thoại" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
            </div>
            <button id="start-chat-btn" class="btn" style="width: 100%; padding: 8px; background: var(--primary-color); color: white; border: none; border-radius: 4px; cursor: pointer;">
                Bắt đầu chat
            </button>
        </div>
    `;
    
    // Chèn form vào chat modal
    chatHeader.insertAdjacentHTML('afterend', customerInfoForm);
    
    let currentCustomer = null;
    
    chatToggle.addEventListener('click', () => {
        chatModal.style.display = 'flex';
        document.getElementById('customer-info-form').style.display = 'block';
        document.querySelector('.chat-body').style.display = 'none';
        document.querySelector('.chat-footer').style.display = 'none';
    });
    
    closeChat.addEventListener('click', () => {
        chatModal.style.display = 'none';
        resetChat();
    });
    
    document.getElementById('start-chat-btn').addEventListener('click', function() {
        const customerName = document.getElementById('customer-chat-name').value.trim();
        const customerPhone = document.getElementById('customer-chat-phone').value.trim();
        
        if (!customerName || !customerPhone) {
            alert('Vui lòng nhập đầy đủ họ tên và số điện thoại!');
            return;
        }
        
        currentCustomer = {
            name: customerName,
            phone: customerPhone
        };
        
        document.getElementById('customer-info-form').style.display = 'none';
        document.querySelector('.chat-body').style.display = 'flex';
        document.querySelector('.chat-footer').style.display = 'flex';
        
        // Thêm tin nhắn chào mừng
        const welcomeMessage = document.createElement('div');
        welcomeMessage.classList.add('message', 'received');
        welcomeMessage.textContent = `Xin chào ${customerName}! Tôi có thể giúp gì cho bạn?`;
        chatBody.appendChild(welcomeMessage);
        chatBody.scrollTop = chatBody.scrollHeight;
    });
    
    sendBtn.addEventListener('click', sendMessage);
    
    chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });
    
    async function sendMessage() {
        if (!currentCustomer) {
            alert('Vui lòng nhập thông tin trước khi gửi tin nhắn!');
            return;
        }
        
        const message = chatInput.value.trim();
        if (message) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', 'sent');
            messageElement.textContent = message;
            chatBody.appendChild(messageElement);
            
            // Save message to API với thông tin khách hàng
            await saveMessageToAPI({
                text: message,
                timestamp: new Date(),
                read: false,
                customerInfo: currentCustomer
            });
            
            await loadMessagesFromAPI();
            
            chatInput.value = '';
            chatBody.scrollTop = chatBody.scrollHeight;
            
            // Simulate response
            setTimeout(async () => {
                const responseElement = document.createElement('div');
                responseElement.classList.add('message', 'received');
                responseElement.textContent = 'Cảm ơn bạn đã liên hệ. Chúng tôi sẽ phản hồi sớm nhất có thể.';
                chatBody.appendChild(responseElement);
                chatBody.scrollTop = chatBody.scrollHeight;
                
                // Save auto-response to API
                await saveMessageToAPI({
                    text: 'Cảm ơn bạn đã liên hệ. Chúng tôi sẽ phản hồi sớm nhất có thể.',
                    timestamp: new Date(),
                    read: false,
                    isAutoResponse: true,
                    customerInfo: currentCustomer
                });
                
                await loadMessagesFromAPI();
            }, 1000);
        }
    }
    
    function resetChat() {
        currentCustomer = null;
        document.getElementById('customer-info-form').style.display = 'block';
        document.querySelector('.chat-body').style.display = 'none';
        document.querySelector('.chat-footer').style.display = 'none';
        document.getElementById('customer-chat-name').value = '';
        document.getElementById('customer-chat-phone').value = '';
        chatBody.innerHTML = '';
    }
    
    // Open chat with product info when clicking chat button on product
    chatButtons.forEach(button => {
        button.addEventListener('click', async () => {
            const productName = button.getAttribute('data-product');
            chatModal.style.display = 'flex';
            
            // Hiển thị form thông tin
            document.getElementById('customer-info-form').style.display = 'block';
            document.querySelector('.chat-body').style.display = 'none';
            document.querySelector('.chat-footer').style.display = 'none';
            
            // Lưu thông tin sản phẩm để sử dụng sau
            chatModal.setAttribute('data-product', productName);
        });
    });
    
    // Login functionality
    const adminLoginBtn = document.getElementById('admin-login-btn');
    
    adminLoginBtn.addEventListener('click', () => {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        
        if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
            document.getElementById('login-modal').style.display = 'none';
            document.getElementById('admin-toggle').classList.add('active');
            localStorage.setItem('adminLoggedIn', 'true');
            alert('Đăng nhập admin thành công!');
            
            // Clear form
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        } else {
            alert('Tên đăng nhập hoặc mật khẩu không đúng!');
        }
    });
    
    // Close modals when clicking outside
    window.addEventListener('click', (e) => {
        if (e.target === document.getElementById('login-modal')) {
            document.getElementById('login-modal').style.display = 'none';
        }
        if (e.target === document.getElementById('payment-modal')) {
            document.getElementById('payment-modal').style.display = 'none';
        }
        if (e.target === chatModal) {
            chatModal.style.display = 'none';
            resetChat();
        }
    });
    
    // Admin Panel Functionality
    const adminToggle = document.getElementById('admin-toggle');
    const adminPanel = document.getElementById('admin-panel');
    const closeAdmin = document.getElementById('close-admin');
    const adminTabs = document.querySelectorAll('.admin-tab');
    const adminContents = document.querySelectorAll('.admin-content');
    
    // Check if admin is already logged in
    if (localStorage.getItem('adminLoggedIn') === 'true') {
        adminToggle.classList.add('active');
    }
    
    adminToggle.addEventListener('click', () => {
        adminPanel.classList.add('active');
    });
    
    closeAdmin.addEventListener('click', () => {
        adminPanel.classList.remove('active');
    });
    
    // Tab switching
    adminTabs.forEach(tab => {
        tab.addEventListener('click', () => {
            const tabId = tab.getAttribute('data-tab');
            
            // Update active tab
            adminTabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            
            // Update active content
            adminContents.forEach(content => {
                content.classList.remove('active');
                if (content.id === `${tabId}-tab`) {
                    content.classList.add('active');
                }
            });
            
            // Refresh data if needed
            if (tabId === 'messages') {
                loadMessagesFromAPI();
            } else if (tabId === 'analytics') {
                updateAnalytics();
            } else if (tabId === 'products') {
                loadProductsFromAPI();
            }
        });
    });
    
    // Render products in admin panel
    function renderProductsInAdmin() {
        const productList = document.getElementById('admin-product-list');
        productList.innerHTML = '';
        
        products.forEach(product => {
            const discount = Math.round((1 - product.salePrice / product.originalPrice) * 100);
            
            const productItem = document.createElement('div');
            productItem.className = 'admin-product-item';
            productItem.innerHTML = `
                <div class="admin-product-info">
                    <strong>${product.name}</strong>
                    <div>${product.category} | ${formatPrice(product.salePrice)} | -${discount}%</div>
                </div>
                <div class="admin-product-actions">
                    <button class="admin-btn edit" data-id="${product.id}">Sửa</button>
                    <button class="admin-btn delete" data-id="${product.id}">Xóa</button>
                </div>
            `;
            
            productList.appendChild(productItem);
        });
        
        // Add event listeners to edit and delete buttons
        document.querySelectorAll('.admin-btn.edit').forEach(btn => {
            btn.addEventListener('click', function() {
                const productId = this.getAttribute('data-id');
                editProduct(productId);
            });
        });
        
        document.querySelectorAll('.admin-btn.delete').forEach(btn => {
            btn.addEventListener('click', function() {
                const productId = this.getAttribute('data-id');
                deleteProduct(productId);
            });
        });
    }
    
    // Cập nhật hiển thị sản phẩm trên trang chủ
    function updateProductDisplay() {
        const productsGrid = document.querySelector('.products-grid');
        if (!productsGrid) return;
        
        productsGrid.innerHTML = '';
        
        products.forEach(product => {
            const discount = Math.round((1 - product.salePrice / product.originalPrice) * 100);
            
            const productCard = document.createElement('div');
            productCard.className = 'product-card';
            productCard.setAttribute('data-id', product.id);
            productCard.innerHTML = `
                <div class="sale-badge">-${discount}%</div>
                <div class="product-image">
                    <img src="${product.image}" alt="${product.name}">
                </div>
                <div class="product-info">
                    <div class="product-category">${product.category}</div>
                    <h3 class="product-name">${product.name}</h3>
                    <div class="product-price">
                        <span class="current-price">${formatPrice(product.salePrice)}</span>
                        <span class="original-price">${formatPrice(product.originalPrice)}</span>
                    </div>
                    <div class="product-actions">
                        <button class="btn add-to-cart" data-id="${product.id}" data-name="${product.name}" data-price="${product.salePrice}" data-image="${product.image}">Thêm vào giỏ</button>
                        <button class="chat-btn" data-product="${product.name}">
                            <i class="fas fa-comment"></i> Chat
                        </button>
                    </div>
                </div>
            `;
            
            productsGrid.appendChild(productCard);
        });
        
        // Re-attach event listeners
        document.querySelectorAll('.add-to-cart').forEach(button => {
            button.addEventListener('click', function() {
                const productId = this.getAttribute('data-id');
                const productName = this.getAttribute('data-name');
                const productPrice = parseInt(this.getAttribute('data-price'));
                const productImage = this.getAttribute('data-image');
                
                addToCart(productId, productName, productPrice, productImage);
            });
        });
        
        document.querySelectorAll('.chat-btn').forEach(button => {
            button.addEventListener('click', async () => {
                const productName = button.getAttribute('data-product');
                chatModal.style.display = 'flex';
                
                document.getElementById('customer-info-form').style.display = 'block';
                document.querySelector('.chat-body').style.display = 'none';
                document.querySelector('.chat-footer').style.display = 'none';
                
                chatModal.setAttribute('data-product', productName);
            });
        });
        
        // Track product views
        document.querySelectorAll('.product-card').forEach(card => {
            card.addEventListener('click', function() {
                const productId = this.getAttribute('data-id');
                productViews[productId] = (productViews[productId] || 0) + 1;
                localStorage.setItem('productViews', JSON.stringify(productViews));
                updateAnalytics();
            });
        });
    }
    
    // Add new product
    document.getElementById('add-product-btn').addEventListener('click', function() {
        document.getElementById('product-form-title').textContent = 'Thêm sản phẩm mới';
        document.getElementById('product-form').style.display = 'block';
        document.getElementById('edit-product-name').value = '';
        document.getElementById('edit-product-category').value = 'Son môi';
        document.getElementById('edit-product-original-price').value = '';
        document.getElementById('edit-product-sale-price').value = '';
        document.getElementById('edit-product-image-url').value = '';
        document.getElementById('image-preview').style.display = 'none';
        document.getElementById('edit-product-description').value = '';
        
        document.getElementById('save-product-btn').removeAttribute('data-id');
    });
    
    // Edit product
    function editProduct(productId) {
        const product = products.find(p => p.id == productId);
        if (product) {
            document.getElementById('product-form-title').textContent = 'Sửa sản phẩm';
            document.getElementById('product-form').style.display = 'block';
            document.getElementById('edit-product-name').value = product.name;
            document.getElementById('edit-product-category').value = product.category;
            document.getElementById('edit-product-original-price').value = product.originalPrice;
            document.getElementById('edit-product-sale-price').value = product.salePrice;
            document.getElementById('edit-product-image-url').value = product.image;
            document.getElementById('edit-product-description').value = product.description || '';
            
            // Show image preview
            const preview = document.getElementById('image-preview');
            preview.src = product.image;
            preview.style.display = 'block';
            
            document.getElementById('save-product-btn').setAttribute('data-id', productId);
        }
    }
    
    // Delete product
    async function deleteProduct(productId) {
        if (confirm('Bạn có chắc chắn muốn xóa sản phẩm này?')) {
            const success = await deleteProductFromAPI(productId);
            if (success) {
                await loadProductsFromAPI();
                alert('✅ Sản phẩm đã được xóa khỏi database!');
            } else {
                alert('❌ Lỗi khi xóa sản phẩm!');
            }
        }
    }
    
    // Save product
    document.getElementById('save-product-btn').addEventListener('click', async function() {
        const productId = this.getAttribute('data-id');
        const name = document.getElementById('edit-product-name').value;
        const category = document.getElementById('edit-product-category').value;
        const originalPrice = parseInt(document.getElementById('edit-product-original-price').value);
        const salePrice = parseInt(document.getElementById('edit-product-sale-price').value);
        const image = document.getElementById('edit-product-image-url').value;
        const description = document.getElementById('edit-product-description').value;
        
        if (name && category && originalPrice && salePrice && image) {
            const productData = {
                name,
                category,
                originalPrice,
                salePrice,
                image,
                description
            };
            
            if (productId) {
                productData.id = parseInt(productId);
            }
            
            const result = await saveProductToAPI(productData);
            if (result) {
                await loadProductsFromAPI();
                document.getElementById('product-form').style.display = 'none';
                alert('✅ Sản phẩm đã được lưu thành công vào database!');
            } else {
                alert('❌ Lỗi khi lưu sản phẩm!');
            }
        } else {
            alert('⚠️ Vui lòng điền đầy đủ thông tin sản phẩm!');
        }
    });
    
    // Cancel product form
    document.getElementById('cancel-product-btn').addEventListener('click', function() {
        document.getElementById('product-form').style.display = 'none';
    });
    
    // Update messages in admin - PHIÊN BẢN MỚI VỚI TÍNH NĂNG TRẢ LỜI CHUYÊN NGHIỆP
    function updateMessagesInAdmin() {
        const messageList = document.getElementById('admin-message-list');
        messageList.innerHTML = '';
        
        if (messages.length === 0) {
            messageList.innerHTML = '<p style="padding: 20px; text-align: center; color: #666;">Chưa có tin nhắn nào</p>';
            return;
        }
        
        // Sắp xếp tin nhắn mới nhất lên đầu
        const sortedMessages = [...messages].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        
        sortedMessages.forEach((message) => {
            const messageId = message.id;
            const isAdminReply = message.isAdminReply;
            const isAutoResponse = message.isAutoResponse;
            const hasCustomerInfo = message.customerInfo;
            
            const messageItem = document.createElement('div');
            messageItem.className = `admin-message-item ${message.read ? '' : 'unread'}`;
            messageItem.innerHTML = `
                <div class="message-preview">
                    <div style="display: flex; justify-content: between; align-items: start;">
                        <div style="flex: 1;">
                            <strong>${hasCustomerInfo ? `${message.customerInfo.name} - ${message.customerInfo.phone}` : 'Khách hàng'}</strong>
                            <div style="color: #666; font-size: 0.9rem; margin-top: 4px;">${message.text.substring(0, 80)}${message.text.length > 80 ? '...' : ''}</div>
                        </div>
                        <div style="text-align: right;">
                            <div class="message-meta">${formatDate(message.timestamp)}</div>
                            ${isAdminReply ? '<div style="color: #007bff; font-size: 0.8rem;">[Phản hồi Admin]</div>' : ''}
                            ${isAutoResponse ? '<div style="color: #28a745; font-size: 0.8rem;">[Tự động]</div>' : ''}
                            ${message.read ? '<div style="color: #6c757d; font-size: 0.8rem;">Đã đọc</div>' : '<div style="color: #dc3545; font-size: 0.8rem;">Chưa đọc</div>'}
                        </div>
                    </div>
                </div>
                <div class="admin-message-content" id="message-content-${messageId}">
                    <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                        <p><strong>Nội dung tin nhắn:</strong></p>
                        <p style="background: white; padding: 10px; border-radius: 4px; border-left: 3px solid var(--primary-color);">${message.text}</p>
                    </div>
                    
                    ${hasCustomerInfo ? `
                        <div style="background: #e7f3ff; padding: 12px; border-radius: 6px; margin-bottom: 15px;">
                            <h5 style="margin: 0 0 8px 0; color: #0056b3;">Thông tin khách hàng</h5>
                            <div style="display: grid; grid-template-columns: auto 1fr; gap: 8px; font-size: 0.9rem;">
                                <strong>Họ tên:</strong> <span>${message.customerInfo.name}</span>
                                <strong>SĐT:</strong> <span>${message.customerInfo.phone}</span>
                                ${message.customerInfo.email ? `<strong>Email:</strong> <span>${message.customerInfo.email}</span>` : ''}
                            </div>
                        </div>
                    ` : ''}
                    
                    <div class="message-meta" style="margin-bottom: 15px;">
                        <strong>Thời gian nhắn tin:</strong> ${formatDate(message.timestamp)}
                    </div>
                    
                    <!-- Hiển thị các phản hồi -->
                    ${message.replies && message.replies.length > 0 ? `
                        <div class="replies-section" style="margin-top: 20px;">
                            <h5 style="color: #28a745; margin-bottom: 10px;">Lịch sử phản hồi:</h5>
                            ${message.replies.map(reply => `
                                <div class="admin-response" style="background: #e7f3ff; padding: 12px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #007bff;">
                                    <div style="display: flex; justify-content: between; margin-bottom: 5px;">
                                        <strong style="color: #0056b3;">${reply.adminName}:</strong>
                                        <span style="color: #666; font-size: 0.8rem;">${formatDate(reply.timestamp)}</span>
                                    </div>
                                    <p style="margin: 0; color: #333;">${reply.text}</p>
                                </div>
                            `).join('')}
                        </div>
                    ` : ''}
                    
                    <!-- Nút hành động -->
                    ${!isAdminReply && !isAutoResponse ? `
                        <div class="message-actions" style="margin-top: 20px; padding-top: 15px; border-top: 1px solid #eee;">
                            <button class="btn mark-read-btn" data-id="${messageId}" style="background: ${message.read ? '#ffc107' : '#28a745'}; color: ${message.read ? '#212529' : 'white'};">
                                <i class="fas ${message.read ? 'fa-envelope' : 'fa-envelope-open'}"></i> 
                                ${message.read ? 'Đánh dấu chưa đọc' : 'Đánh dấu đã đọc'}
                            </button>
                            <button class="btn reply-btn" data-id="${messageId}" style="background: #007bff; color: white;">
                                <i class="fas fa-reply"></i> Trả lời tin nhắn
                            </button>
                        </div>
                    ` : ''}
                    
                    <!-- Form trả lời -->
                    ${!isAdminReply && !isAutoResponse ? `
                        <div class="reply-section" id="reply-section-${messageId}" style="display: none; margin-top: 15px; padding: 15px; background: #f8f9fa; border-radius: 8px;">
                            <h6 style="margin: 0 0 10px 0; color: #495057;">Phản hồi cho khách hàng:</h6>
                            <textarea class="reply-input" id="reply-input-${messageId}" placeholder="Nhập nội dung phản hồi..." rows="4" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-family: inherit;"></textarea>
                            <div class="reply-actions" style="margin-top: 10px; display: flex; gap: 10px;">
                                <button class="btn send-reply-btn" data-id="${messageId}" style="background: #28a745; color: white; flex: 1;">
                                    <i class="fas fa-paper-plane"></i> Gửi phản hồi
                                </button>
                                <button class="btn cancel-reply-btn" data-id="${messageId}" style="background: #6c757d; color: white; flex: 1;">
                                    <i class="fas fa-times"></i> Hủy
                                </button>
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
            
            messageList.appendChild(messageItem);
            
            // Toggle message content
            messageItem.querySelector('.message-preview').addEventListener('click', function() {
                const content = document.getElementById(`message-content-${messageId}`);
                content.classList.toggle('active');
                
                // Auto mark as read when opening
                if (!message.read && content.classList.contains('active')) {
                    markMessageAsRead(messageId).then(() => {
                        loadMessagesFromAPI();
                    });
                }
            });
            
            // Mark as read/unread
            const markReadBtn = messageItem.querySelector('.mark-read-btn');
            if (markReadBtn) {
                markReadBtn.addEventListener('click', async function(e) {
                    e.stopPropagation();
                    const msgId = this.getAttribute('data-id');
                    const success = await markMessageAsRead(msgId);
                    if (success) {
                        await loadMessagesFromAPI();
                    }
                });
            }
            
            // Reply button
            const replyBtn = messageItem.querySelector('.reply-btn');
            if (replyBtn) {
                replyBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const msgId = this.getAttribute('data-id');
                    showReplyForm(msgId);
                });
            }
            
            // Send reply
            const sendReplyBtn = messageItem.querySelector('.send-reply-btn');
            if (sendReplyBtn) {
                sendReplyBtn.addEventListener('click', async function(e) {
                    e.stopPropagation();
                    const msgId = this.getAttribute('data-id');
                    const replyText = document.getElementById(`reply-input-${msgId}`).value.trim();
                    
                    if (replyText) {
                        const success = await replyToMessage(msgId, replyText);
                        if (success) {
                            document.getElementById(`reply-section-${msgId}`).style.display = 'none';
                            document.getElementById(`reply-input-${msgId}`).value = '';
                            alert('✅ Đã gửi phản hồi thành công!');
                        } else {
                            alert('❌ Lỗi khi gửi phản hồi!');
                        }
                    } else {
                        alert('⚠️ Vui lòng nhập nội dung phản hồi!');
                    }
                });
            }
            
            // Cancel reply
            const cancelReplyBtn = messageItem.querySelector('.cancel-reply-btn');
            if (cancelReplyBtn) {
                cancelReplyBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const msgId = this.getAttribute('data-id');
                    document.getElementById(`reply-section-${msgId}`).style.display = 'none';
                });
            }
        });
        
        // Update message count in analytics
        updateAnalytics();
    }
    
    // Update analytics
    function updateAnalytics() {
        document.getElementById('total-visitors').textContent = visitors.total.toLocaleString();
        document.getElementById('today-visitors').textContent = visitors.today.toLocaleString();
        document.getElementById('total-products').textContent = products.length;
        
        const unreadMessages = messages.filter(m => !m.read).length;
        document.getElementById('total-messages').textContent = unreadMessages;
        
        // Show popular products
        const popularProductsContainer = document.getElementById('popular-products');
        popularProductsContainer.innerHTML = '';
        
        // Sort products by views
        const sortedProducts = [...products].sort((a, b) => {
            const viewsA = productViews[a.id] || 0;
            const viewsB = productViews[b.id] || 0;
            return viewsB - viewsA;
        });
        
        // Show top 3 popular products
        sortedProducts.slice(0, 3).forEach(product => {
            const views = productViews[product.id] || 0;
            const productElement = document.createElement('div');
            productElement.className = 'admin-product-item';
            productElement.innerHTML = `
                <div class="admin-product-info">
                    <strong>${product.name}</strong>
                    <div>${views} lượt xem</div>
                </div>
            `;
            popularProductsContainer.appendChild(productElement);
        });
    }
    
    // Save settings
    document.getElementById('save-settings-btn').addEventListener('click', function() {
        const siteTitle = document.getElementById('site-title').value;
        const adminEmail = document.getElementById('admin-email').value;
        const maintenanceMode = document.getElementById('maintenance-mode').checked;
        
        // In a real application, you would save these to a server
        alert('Cài đặt đã được lưu thành công!');
        
        // Update site title if changed
        if (siteTitle !== document.querySelector('.logo').textContent) {
            document.querySelector('.logo').innerHTML = `${siteTitle}<span> Cosmetics</span>`;
        }
    });
    
    // Logout admin
    document.getElementById('logout-admin').addEventListener('click', function() {
        if (confirm('Bạn có chắc chắn muốn đăng xuất?')) {
            localStorage.removeItem('adminLoggedIn');
            document.getElementById('admin-toggle').classList.remove('active');
            adminPanel.classList.remove('active');
            alert('Đã đăng xuất khỏi admin!');
        }
    });
    
    // Utility functions
    function formatPrice(price) {
        return new Intl.NumberFormat('vi-VN').format(price) + 'đ';
    }
    
    function formatDate(date) {
        return new Date(date).toLocaleString('vi-VN');
    }
</script>
